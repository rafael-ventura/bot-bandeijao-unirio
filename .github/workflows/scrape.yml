name: Scrape and Notify

on:
  schedule:
    - cron: '0 10 * * 1' # Monday at 10:00
  workflow_dispatch: # Allow manual runs

jobs:
  scrape_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run scraper and notifications
        working-directory: src/VaiBandeijar
        env:
          Telegram__Enabled: ${{ vars.TELEGRAM_ENABLED }}
          Telegram__BotToken: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          Telegram__ChatId: ${{ secrets.TELEGRAM_CHAT_ID }}
          Email__Enabled: ${{ vars.EMAIL_ENABLED }}
          Email__SmtpHost: ${{ secrets.SMTP_HOST }}
          Email__SmtpUser: ${{ secrets.SMTP_USER }}
          Email__SmtpPassword: ${{ secrets.SMTP_PASSWORD }}
          Email__FromAddress: ${{ secrets.SMTP_FROM_ADDRESS }}
        run: dotnet run --configuration Release

      - name: Commit scraped images
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add cardapiosHist src/assets/cardapios
          git commit -m "Weekly scraping: updated images" || echo "No changes to commit."
          git push origin HEAD:${{ github.ref_name }}
